<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="SQL Map">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#164a4a"/>
      <stop offset="1" stop-color="#0c3434"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- plate -->
  <rect x="8" y="8" width="496" height="496" rx="116" fill="url(#plate)"/>
  <rect x="8" y="8" width="496" height="496" rx="116" fill="url(#sheen)"/>
  <rect x="8" y="8" width="496" height="496" rx="116" fill="none" stroke="#a8e9dc" stroke-opacity="0.22" stroke-width="4"/>

  <!-- connection lanes: sources converge into the mapped result lane -->
  <g stroke="#a8e9dc" fill="none" stroke-linecap="round">
    <path d="M138 178 H216" stroke-width="16" stroke-opacity="0.95"/>
    <path d="M138 334 H216" stroke-width="16" stroke-opacity="0.95"/>
    <path d="M300 256 H382" stroke-width="16" stroke-opacity="0.95"/>
  </g>

  <!-- three source dots -->
  <g fill="#a8e9dc">
    <circle cx="104" cy="178" r="30"/>
    <circle cx="104" cy="334" r="30"/>
    <circle cx="416" cy="256" r="30"/>
  </g>

  <!-- skewed join lane, echoing the app brand mark -->
  <g stroke="#a8e9dc" fill="none" stroke-linecap="round">
    <path d="M226 146 L266 234" stroke-width="16" stroke-opacity="0.9"/>
    <path d="M226 366 L266 278" stroke-width="16" stroke-opacity="0.9"/>
  </g>

  <!-- result lane frame: the mapped table -->
  <g transform="translate(262 214) skewX(-20)">
    <rect x="0" y="0" width="84" height="84" rx="14" fill="none" stroke="#a8e9dc" stroke-width="14"/>
  </g>
</svg>
